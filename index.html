<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Senzorová fúze: profesionální dashboard</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --bg-page: #edf2f7;
            --bg-card: #ffffff;
            --bg-soft: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #d8e1eb;
            --accent: #334155;

            --source-radar: #0ea5e9;
            --source-radar-ble: #ef4444;
            --source-ble-only: #eab308;
            --source-diagnostics: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            background:
                radial-gradient(circle at 8% 10%, rgba(14, 165, 233, 0.10), transparent 28%),
                radial-gradient(circle at 92% 92%, rgba(234, 179, 8, 0.12), transparent 28%),
                var(--bg-page);
            color: var(--text-main);
            font-family: "Segoe UI", "Inter", system-ui, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            margin: 0; padding: 20px;
        }

        .header-panel {
            width: 100%; max-width: 1000px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-top: 4px solid var(--accent);
            padding: 14px 20px; margin-bottom: 14px;
            display: flex; justify-content: space-between; align-items: center;
            border-radius: 12px; box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
            gap: 12px; flex-wrap: wrap;
        }

        .title-wrap h1 { margin: 0; font-size: 20px; letter-spacing: 0.2px; }
        .title-wrap p { margin: 4px 0 0 0; color: var(--text-muted); font-size: 13px; }

        .status-wrap {
            display: flex; align-items: center; gap: 8px; font-size: 12px;
            color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em;
        }

        .legend-row {
            width: 100%; max-width: 1000px; display: flex; gap: 8px;
            margin-bottom: 12px; flex-wrap: wrap;
        }

        .legend-chip {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 999px; padding: 6px 12px; font-size: 12px;
            font-weight: 700; color: #334155;
        }

        .legend-dot { width: 10px; height: 10px; border-radius: 999px; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7); }

        .view-controls {
            display: flex; gap: 10px; margin-bottom: 16px; width: 100%; max-width: 1000px;
        }

        .view-controls button {
            background-color: var(--bg-card); border: 1px solid var(--border);
            padding: 10px 18px; font-weight: 700; text-transform: uppercase;
            border-radius: 8px; cursor: pointer; transition: all 0.2s; letter-spacing: 0.03em;
        }

        .view-controls button.active {
            background-color: var(--accent); color: white; border-color: var(--accent);
            box-shadow: 0 8px 22px rgba(51, 65, 85, 0.22);
        }

        .dashboard { display: flex; flex-direction: row; gap: 20px; justify-content: center; width: 100%; max-width: 1000px; }

        .view-container {
            position: relative; width: 600px; height: 600px;
            background-color: var(--bg-soft); border: 2px solid var(--border);
            border-radius: 12px; overflow: hidden; box-shadow: 0 8px 18px rgba(15, 23, 42, 0.08);
        }

        #radarCanvas { position: absolute; top: 0; left: 0; }
        #view3d { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }

        .tiles-container { display: flex; flex-direction: column; gap: 10px; width: 380px; max-height: 600px; overflow-y: auto; padding-right: 4px; }
        .tiles-container::-webkit-scrollbar { width: 8px; }
        .tiles-container::-webkit-scrollbar-thumb { background: #c7d2de; border-radius: 999px; }
        .stats-container { width: 100%; max-width: 1000px; margin-bottom: 12px; }
        .stats-container .tile { margin: 0; }
        .stats-container .tile-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

        .empty-state { background: var(--bg-card); border: 1px dashed var(--border); border-radius: 12px; color: var(--text-muted); padding: 16px; font-style: italic; }

        .tile {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            box-shadow: 0 5px 14px rgba(15, 23, 42, 0.06); padding: 12px; border-left: 6px solid var(--source-radar);
        }
        .tile.source-radar { border-left-color: var(--source-radar); }
        .tile.source-radar-ble { border-left-color: var(--source-radar-ble); }
        .tile.source-ble-only { border-left-color: var(--source-ble-only); }
        .tile.source-radar-cluster { border-left-color: #dc2626; }
        .tile.source-diagnostics { border-left-color: var(--source-diagnostics); }

        .tile-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
        .tile-title { font-size: 14px; font-weight: 800; margin: 0; line-height: 1.25; word-break: break-word; }
        .tile-sub { margin-top: 2px; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

        .badge-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; border: 1px solid transparent; white-space: nowrap; }
        .badge-radar { color: #0369a1; background: #e0f2fe; border-color: #bae6fd; }
        .badge-radar-cluster { color: #991b1b; background: #fee2e2; border-color: #fecaca; }
        .badge-radar-ble { color: #991b1b; background: #fee2e2; border-color: #fecaca; }
        .badge-ble-only { color: #854d0e; background: #fef3c7; border-color: #fde68a; }
        .badge-type { color: #475569; background: #f1f5f9; border-color: #e2e8f0; }

        .tile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
        .metric { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 7px 8px; }
        .metric-label { display: block; font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
        .metric-value { font-size: 13px; font-weight: 700; color: #0f172a; }

        .conf-wrap { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .conf-label { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
        .conf-value { font-size: 12px; font-weight: 800; color: #0f172a; }
        .conf-bar { width: 100%; height: 8px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
        .conf-fill { height: 100%; border-radius: 999px; width: 0; transition: width 120ms linear; background: linear-gradient(90deg, #ef4444 0%, #eab308 55%, #0ea5e9 100%); }

        .status { color: #075985; font-weight: 800; background: #e0f2fe; padding: 4px 10px; border-radius: 999px; border: 1px solid #bae6fd; font-size: 12px; }
        .status.disconnected { color: #b91c1c; background: #fee2e2; border-color: #fecaca; }

        @media (max-width: 1100px) {
            .dashboard { flex-direction: column; align-items: center; }
            .view-container, .tiles-container { width: min(95vw, 700px); }
            .tiles-container { max-height: none; }
            .stats-container .tile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="title-wrap">
            <h1>Senzorová fúze 3x3m</h1>
            <p>Přehled tras a zdrojů: radar vs. radar+BLE vs. BLE-only</p>
        </div>
        <div class="status-wrap">STATUS: <span id="status" class="status disconnected">OFFLINE</span></div>
    </div>

    <div id="stats-container" class="stats-container">
        <div class="tile source-diagnostics">
            <div class="tile-head">
                <div>
                    <h3 class="tile-title">DIAGNOSTIKA SENZORŮ</h3>
                    <div class="tile-sub">čekám na první zprávu</div>
                </div>
            </div>
            <div class="tile-grid">
                <div class="metric"><span class="metric-label">Radar nový</span><span class="metric-value">0</span></div>
                <div class="metric"><span class="metric-label">Radar historie</span><span class="metric-value">0</span></div>
                <div class="metric"><span class="metric-label">Radar clustery</span><span class="metric-value">0</span></div>
                <div class="metric"><span class="metric-label">BLE 1 tagy</span><span class="metric-value">0</span></div>
                <div class="metric"><span class="metric-label">BLE 2 tagy</span><span class="metric-value">0</span></div>
                <div class="metric"><span class="metric-label">Společné BLE</span><span class="metric-value">0</span></div>
                <div class="metric"><span class="metric-label">Triangulace</span><span class="metric-value">0</span></div>
            </div>
            <div class="conf-wrap">
                <span class="conf-label">Poslední update</span>
                <span class="conf-value">-</span>
            </div>
        </div>
    </div>

    <div class="legend-row">
        <span class="legend-chip"><span class="legend-dot" style="background: var(--source-radar);"></span>Radar only</span>
        <span class="legend-chip"><span class="legend-dot" style="background: var(--source-radar-ble);"></span>Radar + BLE</span>
        <span class="legend-chip"><span class="legend-dot" style="background: var(--source-ble-only);"></span>BLE only</span>
    </div>

    <div class="view-controls">
        <button id="btn2d" class="active" onclick="switchView('2d')">2D Pohled</button>
        <button id="btn3d" onclick="switchView('3d')">3D Pohled</button>
    </div>

    <div class="dashboard">
        <div class="view-container">
            <canvas id="radarCanvas" width="600" height="600"></canvas>
            <div id="view3d"></div>
        </div>
        <div id="tiles-container" class="tiles-container"></div>
    </div>

    <script>
        const COLOR_SOURCE = { radar: '#0ea5e9', radar_raw: '#0ea5e9', radar_cluster: '#dc2626', radar_ble: '#ef4444', ble_only: '#eab308' };
        const SENSOR_NODES = [ { id: "S1", x: 1.5, y: 0.0, z: 0.8 }, { id: "S2", x: 0.0, y: 1.5, z: 0.8 } ];

        let currentMode = '2d';
        let latestObjects = [];
        let latestStats = null;
        let displayState = {};
        let latestRadarPoints = [];
        let lastAnimationTimeSec = performance.now() / 1000;

        const TRACK_SMOOTH_SECONDS = 0.34;
        const BLE_SMOOTH_SECONDS = 0.55;
        const TRACK_MAX_VISUAL_SPEED_MPS = 1.10;
        const BLE_MAX_VISUAL_SPEED_MPS = 0.55;
        const VISUAL_HOLD_SECONDS = 1.6;

        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const tilesContainer = document.getElementById('tiles-container');
        const statsContainer = document.getElementById('stats-container');

        const PIXELS_PER_METER = 180;
        const OFFSET = 30;

        function switchView(mode) {
            currentMode = mode;
            document.getElementById('btn2d').classList.toggle('active', mode === '2d');
            document.getElementById('btn3d').classList.toggle('active', mode === '3d');
            canvas.style.display = mode === '2d' ? 'block' : 'none';
            document.getElementById('view3d').style.display = mode === '3d' ? 'block' : 'none';
        }

        function normalizeTagId(tagId) {
            if (tagId === null || tagId === undefined) return "";
            return String(tagId).trim().toUpperCase().replace(/[^A-Z0-9_]/g, "");
        }

        function dedupeByTagId(objects) {
            const bestById = new Map();
            objects.forEach(obj => {
                const id = normalizeTagId(obj.tag_id) || String(obj.tag_id ?? "");
                if (!id) return;
                const prev = bestById.get(id);
                const prevConf = prev?.confidence ?? 0;
                const newConf = obj.confidence ?? 0;
                if (!prev || newConf > prevConf) bestById.set(id, obj);
            });
            return Array.from(bestById.values());
        }

        function getObjectType(obj) {
            const type = String(obj.object_type || '').toLowerCase();
            if (type) return type;
            const id = String(obj.tag_id || '').toUpperCase();
            if (id.startsWith('BLE_')) return 'ble_only';
            if (id.startsWith('TAG_')) return 'tagged';
            return 'untagged';
        }

        function getSourceCategory(obj) {
            const sourceRaw = String(obj.source || '').toLowerCase();
            const type = getObjectType(obj);
            const id = String(obj.tag_id || '').toUpperCase();

            if (sourceRaw.includes('ble_only') || sourceRaw.includes('ble only')) return 'ble_only';
            if (sourceRaw.includes('radar_cluster') || type === 'radar_cluster') return 'radar_cluster';
            if (sourceRaw.includes('radar_raw') || type === 'radar_raw') return 'radar_raw';
            if ((sourceRaw.includes('radar') && sourceRaw.includes('ble')) || sourceRaw.includes('radar+ble')) return 'radar_ble';
            if (sourceRaw.includes('ble') && !sourceRaw.includes('radar')) return 'ble_only';
            if (sourceRaw.includes('radar')) return 'radar';

            if (type === 'ble_only' || id.startsWith('BLE_')) return 'ble_only';
            if (type === 'tagged' || id.startsWith('TAG_')) return 'radar_ble';
            return 'radar';
        }

        function getSourceLabel(obj) {
            const source = getSourceCategory(obj);
            if (source === 'radar_cluster') return 'Radar cluster';
            if (source === 'radar_ble') return 'Radar + BLE';
            if (source === 'ble_only') return 'BLE only';
            return 'Radar only';
        }

        function getTypeLabel(obj) {
            const type = getObjectType(obj);
            if (type === 'radar_raw') return 'Raw';
            if (type === 'radar_cluster') return 'Cluster';
            if (type === 'tagged') return 'Tagged';
            if (type === 'ble_only') return 'BLE';
            return 'Track';
        }

        function getSourceColor(obj) { return COLOR_SOURCE[getSourceCategory(obj)] || COLOR_SOURCE.radar; }

        function getSourceBadgeClass(obj) {
            const source = getSourceCategory(obj);
            if (source === 'radar_cluster') return 'badge-radar-cluster';
            if (source === 'radar_ble') return 'badge-radar-ble';
            if (source === 'ble_only') return 'badge-ble-only';
            return 'badge-radar';
        }

        function getTileClass(obj) {
            const source = getSourceCategory(obj);
            if (source === 'radar_cluster') return 'source-radar-cluster';
            if (source === 'radar_ble') return 'source-radar-ble';
            if (source === 'ble_only') return 'source-ble-only';
            return 'source-radar';
        }

        function isBLEOnly(obj) { return getSourceCategory(obj) === 'ble_only'; }

        function isRadarRaw(obj) {
            return String(obj.object_type || '').toLowerCase() === 'radar_raw' || String(obj.source || '').toLowerCase() === 'radar_raw';
        }

        function safeNum(value, fallback = 0) { const n = Number(value); return Number.isFinite(n) ? n : fallback; }

        function smoothObjectPosition(displayObj, targetObj, dtSec) {
            const isBle = isBLEOnly(targetObj);
            if (isRadarRaw(targetObj)) {
                // Surový radar se nevyhlazuje - okamžitý snap
                displayObj.x = safeNum(targetObj.x, safeNum(displayObj.x));
                displayObj.y = safeNum(targetObj.y, safeNum(displayObj.y));
                if (targetObj.z !== undefined) displayObj.z = safeNum(targetObj.z, safeNum(displayObj.z));
                return;
            }

            const smoothSeconds = isBle ? BLE_SMOOTH_SECONDS : TRACK_SMOOTH_SECONDS;
            const maxSpeed = isBle ? BLE_MAX_VISUAL_SPEED_MPS : TRACK_MAX_VISUAL_SPEED_MPS;
            const alpha = 1 - Math.exp(-Math.max(0.001, dtSec) / smoothSeconds);

            const currentX = safeNum(displayObj.x, safeNum(targetObj.x));
            const currentY = safeNum(displayObj.y, safeNum(targetObj.y));
            const targetX = safeNum(targetObj.x, currentX);
            const targetY = safeNum(targetObj.y, currentY);

            let nextX = currentX + (targetX - currentX) * alpha;
            let nextY = currentY + (targetY - currentY) * alpha;

            const dx = nextX - currentX;
            const dy = nextY - currentY;
            const step = Math.hypot(dx, dy);
            const maxStep = maxSpeed * Math.max(0.001, dtSec);

            if (step > maxStep && step > 0) {
                const scale = maxStep / step;
                nextX = currentX + dx * scale;
                nextY = currentY + dy * scale;
            }

            displayObj.x = nextX;
            displayObj.y = nextY;
            if (targetObj.z !== undefined) {
                const currentZ = safeNum(displayObj.z, safeNum(targetObj.z));
                displayObj.z = currentZ + (safeNum(targetObj.z) - currentZ) * alpha;
            }
        }

        function formatMeters(value) { return `${safeNum(value).toFixed(2)} m`; }
        function formatConf(value) { return safeNum(value).toFixed(2); }
        function escapeHtml(value) {
            return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function updateDebugPanel(stats) {
            if (!stats) return;
            latestStats = stats;
        }

        function drawMap2D() {
            ctx.clearRect(0, 0, 600, 600);
            const axisXColor = '#2563eb';
            const axisYColor = '#dc2626';

            ctx.lineWidth = 1; ctx.strokeStyle = '#cbd5e1';
            for (let i = 0; i <= 3; i++) {
                const p = OFFSET + (i * PIXELS_PER_METER);
                ctx.beginPath(); ctx.moveTo(p, 600 - OFFSET); ctx.lineTo(p, 600 - OFFSET - 3 * PIXELS_PER_METER); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(OFFSET, 600 - p); ctx.lineTo(OFFSET + 3 * PIXELS_PER_METER, 600 - p); ctx.stroke();
                ctx.font = 'bold 12px Arial';
                ctx.fillStyle = axisXColor; ctx.fillText(`${i}m`, p - 8, 600 - 10);
                ctx.fillStyle = axisYColor; ctx.fillText(`${i}m`, 5, 600 - p + 4);
            }

            ctx.lineWidth = 3;
            ctx.strokeStyle = axisXColor;
            ctx.beginPath(); ctx.moveTo(OFFSET, 600 - OFFSET); ctx.lineTo(600 - OFFSET + 8, 600 - OFFSET); ctx.stroke();
            ctx.strokeStyle = axisYColor;
            ctx.beginPath(); ctx.moveTo(OFFSET, 600 - OFFSET); ctx.lineTo(OFFSET, OFFSET - 8); ctx.stroke();

            ctx.font = 'bold 15px Arial';
            ctx.fillStyle = axisXColor; ctx.fillText('X', 600 - OFFSET + 12, 600 - OFFSET + 5);
            ctx.fillStyle = axisYColor; ctx.fillText('Y', OFFSET - 5, OFFSET - 14);

            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1; ctx.strokeRect(OFFSET, OFFSET, 3 * PIXELS_PER_METER, 3 * PIXELS_PER_METER);

            SENSOR_NODES.forEach(s => {
                const px = OFFSET + (s.x * PIXELS_PER_METER);
                const py = (600 - OFFSET) - (s.y * PIXELS_PER_METER);
                ctx.fillStyle = '#1e293b'; ctx.fillRect(px - 10, py - 10, 20, 20);
                ctx.fillStyle = 'white'; ctx.font = 'bold 10px Arial'; ctx.fillText(s.id, px - 6, py + 4);
            });
        }

        function drawObjects2D(objects) {
            drawMap2D();
            const order = { radar: 0, radar_ble: 1, ble_only: 2 };
            objects.sort((a, b) => (order[getSourceCategory(a)] ?? 0) - (order[getSourceCategory(b)] ?? 0));

            objects.forEach(obj => {
                const x = safeNum(obj.x); const y = safeNum(obj.y);
                const px = OFFSET + (x * PIXELS_PER_METER); const py = (600 - OFFSET) - (y * PIXELS_PER_METER);
                const source = getSourceCategory(obj); const color = getSourceColor(obj);
                const conf = Math.max(0.10, safeNum(obj.confidence, 1));
                const rawRadar = isRadarRaw(obj);
                const isCluster = source === 'radar_cluster';
                const radius = rawRadar ? 8 : (isCluster ? 17 : (source === 'ble_only' ? 15 : 11));

                ctx.globalAlpha = conf;
                ctx.beginPath(); ctx.arc(px, py, radius, 0, 2 * Math.PI);
                ctx.fillStyle = color; ctx.fill();

                ctx.lineWidth = rawRadar ? 2 : (isCluster ? 4 : 3);
                ctx.strokeStyle = rawRadar ? 'rgba(255, 255, 255, 0.85)' : '#ffffff';
                ctx.shadowColor = rawRadar ? 'rgba(14, 165, 233, 0.85)' : (isCluster ? 'rgba(220, 38, 38, 0.75)' : 'rgba(0, 0, 0, 0.35)');
                ctx.shadowBlur = rawRadar ? 12 : (isCluster ? 14 : 6); ctx.stroke();
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                if (isCluster) {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 11px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(String(obj.points ?? ''), px, py);
                }

                if (source !== 'radar' && !rawRadar && !isCluster) {
                    ctx.beginPath(); ctx.arc(px, py, source === 'ble_only' ? 22 : 18, 0, 2 * Math.PI);
                    ctx.lineWidth = 2; ctx.strokeStyle = source === 'ble_only' ? 'rgba(234, 179, 8, 0.55)' : 'rgba(239, 68, 68, 0.45)';
                    ctx.stroke();
                }
                ctx.globalAlpha = 1.0;
            });
        }

        const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf8fafc);
        const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100); camera.position.set(3.9, 5.25, 4.2);
        const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(600, 600);
        renderer.setPixelRatio(window.devicePixelRatio || 1); renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
        document.getElementById('view3d').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(1.5, 1.0, -1.5); controls.enableDamping = true; controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 2.2; controls.maxDistance = 8.5;

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.95, metalness: 0.0 }));
        floor.rotation.x = -Math.PI / 2; floor.position.set(1.5, 0, -1.5); scene.add(floor);

        function toScenePosition(x, y, z = 0) {
            return new THREE.Vector3(x, z, -y);
        }

        function createTextSprite(text, color = '#0f172a', scale = 0.18) {
            const labelCanvas = document.createElement('canvas');
            labelCanvas.width = 256;
            labelCanvas.height = 96;
            const labelCtx = labelCanvas.getContext('2d');
            labelCtx.clearRect(0, 0, labelCanvas.width, labelCanvas.height);
            labelCtx.font = 'bold 38px Arial';
            labelCtx.fillStyle = color;
            labelCtx.textAlign = 'center';
            labelCtx.textBaseline = 'middle';
            labelCtx.fillText(text, labelCanvas.width / 2, labelCanvas.height / 2);

            const texture = new THREE.CanvasTexture(labelCanvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
            sprite.scale.set(scale * 2.6, scale, scale);
            return sprite;
        }

        function addTextLabel(text, position, color, scale) {
            const label = createTextSprite(text, color, scale);
            label.position.copy(position);
            label.renderOrder = 10;
            scene.add(label);
            return label;
        }

        function addLine(start, end, color, opacity = 1) {
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([start, end]),
                new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity })
            );
            scene.add(line);
            return line;
        }

        function addReference3D() {
            const xColor = 0x2563eb;
            const yColor = 0xdc2626;
            const zColor = 0x16a34a;
            const boxColor = 0x94a3b8;

            const bottom = [
                toScenePosition(0, 0, 0), toScenePosition(3, 0, 0),
                toScenePosition(3, 3, 0), toScenePosition(0, 3, 0)
            ];
            const top = [
                toScenePosition(0, 0, 3), toScenePosition(3, 0, 3),
                toScenePosition(3, 3, 3), toScenePosition(0, 3, 3)
            ];
            for (let i = 0; i < 4; i++) {
                addLine(bottom[i], bottom[(i + 1) % 4], boxColor, 0.45);
                addLine(top[i], top[(i + 1) % 4], boxColor, 0.28);
                addLine(bottom[i], top[i], boxColor, 0.28);
            }

            addLine(toScenePosition(0, 0, 0.025), toScenePosition(3.25, 0, 0.025), xColor, 1);
            addLine(toScenePosition(0, 0, 0.025), toScenePosition(0, 3.25, 0.025), yColor, 1);
            addLine(toScenePosition(0, 0, 0), toScenePosition(0, 0, 3.25), zColor, 1);

            addTextLabel('X', toScenePosition(3.38, 0, 0.12), '#2563eb', 0.22);
            addTextLabel('Y', toScenePosition(0, 3.38, 0.12), '#dc2626', 0.22);
            addTextLabel('Z', toScenePosition(0, 0, 3.38), '#16a34a', 0.22);

            for (let i = 0; i <= 3; i++) {
                addTextLabel(`${i}m`, toScenePosition(i, -0.18, 0.04), '#1e3a8a', 0.13);
                addTextLabel(`${i}m`, toScenePosition(-0.18, i, 0.04), '#7f1d1d', 0.13);
                addTextLabel(`${i}m`, toScenePosition(-0.18, 0, i), '#14532d', 0.13);
            }

            SENSOR_NODES.forEach(sensor => {
                const sensorGroup = new THREE.Group();
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(0.18, 0.18, 0.18),
                    new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.35, metalness: 0.05 })
                );
                sensorGroup.add(body);
                const stand = new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -sensor.z, 0)]),
                    new THREE.LineBasicMaterial({ color: 0x111827, transparent: true, opacity: 0.65 })
                );
                sensorGroup.add(stand);
                sensorGroup.position.copy(toScenePosition(sensor.x, sensor.y, sensor.z));
                scene.add(sensorGroup);
                addTextLabel(sensor.id, toScenePosition(sensor.x, sensor.y, sensor.z + 0.28), '#111827', 0.17);
            });
        }

        try {
            addReference3D();
        } catch (error) {
            console.warn('3D reference overlay disabled:', error);
        }

        const roomOutline = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0.01, 0), new THREE.Vector3(3, 0.01, 0), new THREE.Vector3(3, 0.01, -3), new THREE.Vector3(0, 0.01, -3), new THREE.Vector3(0, 0.01, 0)
        ]);
        scene.add(new THREE.Line(roomOutline, new THREE.LineBasicMaterial({ color: 0x334155 })));
        const grid = new THREE.GridHelper(3, 12, 0x94a3b8, 0xdbe5ee); grid.position.set(1.5, 0.001, -1.5); scene.add(grid);
        scene.add(new THREE.HemisphereLight(0xffffff, 0xe2e8f0, 0.72));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.65); dirLight.position.set(4.2, 8, 3.1); scene.add(dirLight);

        const meshes3D = {};

        function createTrackMesh(source) {
            const isBleOnly = source === 'ble_only'; const isRawRadar = source === 'radar_raw';
            const radius = isRawRadar ? 0.055 : (isBleOnly ? 0.17 : 0.13);
            const colorHex = getSourceColor({ source, object_type: source === 'ble_only' ? 'ble_only' : 'tagged' });
            const group = new THREE.Group();

            const sphereGeo = new THREE.SphereGeometry(radius, 24, 24);
            const sphereMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: isBleOnly ? 0.25 : 0.20, roughness: 0.28, metalness: 0.02, transparent: true });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat); group.add(sphere);

            if (!isRawRadar) {
                const ringRadius = isBleOnly ? 0.34 : 0.29;
                const ring = new THREE.Mesh(new THREE.RingGeometry(ringRadius - 0.02, ringRadius, 40), new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: isBleOnly ? 0.58 : 0.50 }));
                ring.rotation.x = -Math.PI / 2; ring.position.y = -radius + 0.02; group.add(ring);
                if (!isBleOnly) {
                    const outline = new THREE.LineSegments(new THREE.EdgesGeometry(sphereGeo), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.90 }));
                    group.add(outline);
                }
                group.userData = { sphere, ring, source };
            } else {
                group.userData = { sphere, ring: null, source }; // Radar nemá velké prstence
            }
            return group;
        }

        function updateObjects3D(objects) {
            const currentIds = new Set(); const nowSec = performance.now() / 1000;
            objects.forEach(obj => {
                const id = String(obj.tag_id); const source = getSourceCategory(obj); currentIds.add(id);
                const needsRebuild = !meshes3D[id] || meshes3D[id].userData.source !== source;
                if (needsRebuild) {
                    if (meshes3D[id]) scene.remove(meshes3D[id]);
                    meshes3D[id] = createTrackMesh(source); scene.add(meshes3D[id]);
                }
                const meshGroup = meshes3D[id]; const sphere = meshGroup.userData.sphere; const ring = meshGroup.userData.ring;
                const color = getSourceColor(obj); const conf = Math.max(0.10, safeNum(obj.confidence, 1));
                meshGroup.position.set(safeNum(obj.x), safeNum(obj.z, 0.5), -safeNum(obj.y));
                sphere.material.color.set(color); sphere.material.emissive.set(color); sphere.material.opacity = conf;

                if (ring) {
                    const pulse = 0.92 + 0.12 * Math.sin(nowSec * 4 + id.length * 0.35);
                    ring.scale.setScalar(pulse); ring.material.color.set(color);
                    ring.material.opacity = Math.max(0.25, conf * (source === 'radar' ? 0.45 : 0.62));
                }
            });
            Object.keys(meshes3D).forEach(id => {
                if (!currentIds.has(id)) { scene.remove(meshes3D[id]); delete meshes3D[id]; }
            });
        }

        function connect() {
            const ws = new WebSocket(`ws://${window.location.host}/ws`); // Nebo upravte na absolutní ws://127.0.0.1:8765 pokud nenačítáte z localhostu
            ws.onopen = () => { document.getElementById('status').className = 'status'; document.getElementById('status').innerText = 'ONLINE'; };

            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                updateDebugPanel(data.stats);
                let combined = [];

                // --- MAPOVÁNÍ DAT Z NOVÉHO FUSION.PY ---

                // 1. Zpracování surových radarových bodů
                if (data.radar && Array.isArray(data.radar)) {
                    latestRadarPoints = data.radar.map((r, index) => ({
                            tag_id: 'RAW_R_' + Math.random().toString(36).substr(2, 6),
                            object_type: 'radar_raw',
                            source: 'radar_raw',
                            x: r.x, y: r.y, z: r.z,
                            confidence: 0.95
                    }));
                }

                if (data.radar_clusters && Array.isArray(data.radar_clusters)) {
                    data.radar_clusters.forEach(cluster => {
                        combined.push({
                            tag_id: cluster.id,
                            object_type: 'radar_cluster',
                            source: 'radar_cluster',
                            x: cluster.x,
                            y: cluster.y,
                            z: cluster.z,
                            points: cluster.points,
                            confidence: Math.min(1.0, 0.45 + (cluster.points * 0.08))
                        });
                    });
                }

                // 2. Zpracování BLE dat
                if (data.ble && Array.isArray(data.ble)) {
                    data.ble.forEach(b => {
                        combined.push({
                            tag_id: b.tag_id,
                            object_type: 'ble_only',
                            source: 'ble_only',
                            x: b.x, y: b.y, z: 0.8,
                            confidence: 0.6
                        });
                    });
                }

                // Pokud by fusion.py posílal už sloužená data ve starém formátu "objects"
                if (data.type === "update" && data.objects) {
                    combined = combined.concat(data.objects);
                }

                latestObjects = combined;
            };

            ws.onclose = () => {
                document.getElementById('status').className = 'status disconnected'; document.getElementById('status').innerText = 'OFFLINE';
                setTimeout(connect, 2000);
            };
        }

        function renderStatsPanel() {
            statsContainer.innerHTML = `
                <div class="tile source-diagnostics">
                    <div class="tile-head">
                        <div>
                            <h3 class="tile-title">DIAGNOSTIKA SENZORŮ</h3>
                            <div class="tile-sub">${latestStats ? 'živý MQTT/WebSocket stream' : 'čekám na první zprávu'}</div>
                        </div>
                    </div>
                    <div class="tile-grid">
                        <div class="metric"><span class="metric-label">Radar nový</span><span class="metric-value">${latestStats?.new_radar_points ?? 0}</span></div>
                        <div class="metric"><span class="metric-label">Radar historie</span><span class="metric-value">${latestStats?.radar_history_points ?? 0}</span></div>
                        <div class="metric"><span class="metric-label">Radar clustery</span><span class="metric-value">${latestStats?.radar_clusters ?? 0}</span></div>
                        <div class="metric"><span class="metric-label">BLE 1 tagy</span><span class="metric-value">${latestStats?.ble_1_tags ?? 0}</span></div>
                        <div class="metric"><span class="metric-label">BLE 2 tagy</span><span class="metric-value">${latestStats?.ble_2_tags ?? 0}</span></div>
                        <div class="metric"><span class="metric-label">Společné BLE</span><span class="metric-value">${latestStats?.common_ble_tags ?? 0}</span></div>
                        <div class="metric"><span class="metric-label">Triangulace</span><span class="metric-value">${latestStats?.triangulated_ble ?? 0}</span></div>
                    </div>
                    <div class="conf-wrap">
                        <span class="conf-label">Poslední update</span>
                        <span class="conf-value">${latestStats ? new Date(latestStats.timestamp * 1000).toLocaleTimeString() : '-'}</span>
                    </div>
                </div>`;
        }

        function renderTiles(drawList) {
            renderStatsPanel();
            // ODFILTROVÁNÍ SUROVÉHO RADARU, aby nezahltil DOM a nezhroutil prohlížeč
            const filteredForTiles = drawList.filter(obj => !isRadarRaw(obj));
            if (filteredForTiles.length === 0) {
                tilesContainer.innerHTML = '<div class="empty-state">Žádné sledované cíle (Surová data z radaru nezobrazujeme v seznamu)</div>';
                return;
            }

            const sorted = [...filteredForTiles].sort((a, b) => safeNum(b.confidence) - safeNum(a.confidence));
            tilesContainer.innerHTML = sorted.map(obj => {
                const sourceLabel = getSourceLabel(obj); const sourceBadgeClass = getSourceBadgeClass(obj);
                const sourceClass = getTileClass(obj); const conf = safeNum(obj.confidence, 0);
                const confPct = Math.max(0, Math.min(100, conf * 100)); const tagId = escapeHtml(obj.tag_id || 'UNKNOWN');
                return `
                    <div class="tile ${sourceClass}">
                        <div class="tile-head"><div><h3 class="tile-title">${tagId}</h3><div class="tile-sub">${escapeHtml(String(obj.source || 'fused-stream'))}</div></div>
                        <div class="badge-row"><span class="badge ${sourceBadgeClass}">${sourceLabel}</span><span class="badge badge-type">${getTypeLabel(obj)}</span></div></div>
                        <div class="tile-grid">
                            <div class="metric"><span class="metric-label">X</span><span class="metric-value">${formatMeters(obj.x)}</span></div>
                            <div class="metric"><span class="metric-label">Y</span><span class="metric-value">${formatMeters(obj.y)}</span></div>
                            <div class="metric"><span class="metric-label">Z</span><span class="metric-value">${formatMeters(obj.z)}</span></div>
                            <div class="metric"><span class="metric-label">Confidence</span><span class="metric-value">${formatConf(conf)}</span></div>
                        </div>
                        <div class="conf-wrap"><span class="conf-label">Stabilita trasy</span><span class="conf-value">${confPct.toFixed(0)}%</span></div>
                        <div class="conf-bar"><div class="conf-fill" style="width:${confPct}%"></div></div>
                    </div>`;
            }).join('');
        }

        function animationLoop() {
            requestAnimationFrame(animationLoop);
            const nowSec = performance.now() / 1000;
            const dtSec = Math.min(0.08, Math.max(0.001, nowSec - lastAnimationTimeSec));
            lastAnimationTimeSec = nowSec;

            const currentIds = new Set();
            const latestUniqueObjects = dedupeByTagId(latestObjects);

            latestUniqueObjects.forEach(target => {
                const id = String(target.tag_id);
                currentIds.add(id);

                if (!displayState[id]) {
                    displayState[id] = { ...target, last_seen: nowSec, last_reported_confidence: target.confidence ?? 1.0 };
                } else {
                    smoothObjectPosition(displayState[id], target, dtSec);
                    displayState[id].confidence = target.confidence ?? 1.0;
                    displayState[id].last_reported_confidence = target.confidence ?? 1.0;
                    displayState[id].object_type = target.object_type || displayState[id].object_type;
                    displayState[id].source = target.source || displayState[id].source;
                    displayState[id].last_seen = nowSec;
                }
            });

            Object.keys(displayState).forEach(id => {
                if (currentIds.has(id)) return;
                const obj = displayState[id];
                const age = nowSec - (obj.last_seen || nowSec);

                if (age > VISUAL_HOLD_SECONDS) {
                    delete displayState[id];
                    return;
                }
                const baseConf = obj.last_reported_confidence ?? obj.confidence ?? 1.0;
                obj.confidence = Math.max(0.15, baseConf * (1 - (age / VISUAL_HOLD_SECONDS)));
            });

            const drawList = latestRadarPoints.concat(Object.values(displayState));
            if (currentMode === '2d') { drawObjects2D(drawList); } else { controls.update(); updateObjects3D(drawList); renderer.render(scene, camera); }
            renderTiles(drawList);
        }

        connect();
        animationLoop();
    </script>
</body>
